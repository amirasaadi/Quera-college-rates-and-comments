<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بررسی و نظرسنجی دوره‌های کوئرا</title>
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-effects">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="glass-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <h1>کیفیت‌سنجی دوره‌های کوئرا</h1>
                </div>
                <div class="actions">
                    <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <a href="https://github.com/amirasaadi/Quera-college-rates-and-comments/edit/main/data.js" target="_blank" class="github-btn">
                        <i class="fa-brands fa-github"></i>
                        <span>ثبت دوره جدید</span>
                    </a>
                </div>
            </div>
            <p class="subtitle">نظرات واقعی و بدون سانسور برنامه‌نویسان درباره دوره‌های آموزشی کوئرا (Quera)</p>
        </div>
    </header>

    <main class="container">
        <div class="search-bar glass-panel">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="search-input" placeholder="جستجوی دوره، مدرس یا موضوع...">
        </div>

        <div id="courses-grid" class="courses-grid">
            <!-- Courses will be injected here by app.js -->
        </div>
    </main>

    <!-- Modal for Course Details & Comments -->
    <div id="course-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-btn">&times;</span>
            <div id="modal-body">
                <!-- Course details will be injected here -->
            </div>
            
            <div class="giscus-section">
                <h3><i class="fa-regular fa-comments"></i> نظرات جامعه گیت‌هاب</h3>
                <p class="giscus-help">برای ثبت نظر، لطفاً با اکانت گیت‌هاب خود وارد شوید.</p>
                <div id="giscus-container">
                    <!-- Giscus script will be loaded here dynamically -->
                </div>
                

            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
